# The April model's paths and training hyperparameters. NOT a complete record of how April was built
# (note added 2026-11-14; audit finding 2.7 and Part 3, 7c deviation 11):
#   - Priors. initialization.t3_prior_source and t4_zero_priors below were added to this file on 2026-10-05/06
#     (commit 916680e), for the retrain. April's initial checkpoint (data/models/rat_genecompass_init/, files
#     dated 2026-04-02, no provenance record) was built before those options existed, by looking T3 prior rows
#     up under the rat gene ID. That is what `t3_prior_source: stage6` with `t4_zero_priors: []` does today,
#     and it left every T3a row zero in all four priors. The only table of April's prior rows is an
#     uncommitted local file (tmp/data_audit/prior_zero_rows_by_tier.tsv); it was not recomputed for this note.
#     The values below are left as they are: changing them would not rebuild April's checkpoint, and
#     rat_model_init.py now refuses `stage6` unless allow_legacy_t3_priors is set.
#   - Save interval. logging.save_steps is 10000. April's phase 2 was saved every 10,000 steps, but its phase 1
#     every 125,000 (save_steps in rat_phase1_freeze_mixed/checkpoint-129449/trainer_state.json and
#     rat_phase2_mixed_species/checkpoint-147941/trainer_state.json).
#   - April's weights are read-only on disk; nothing should be trained from this file into the same folders.
model:
  base_checkpoint: vendor/GeneCompass/pretrained_models/GeneCompass_Base
  init_checkpoint: data/models/rat_genecompass_init
  vocab_size: 55275        # was 53032
  num_species: 3
  hidden_size: 768
  num_hidden_layers: 12
  num_attention_heads: 12
  intermediate_size: 3072
  max_position_embeddings: 2048

data:
  token_dict_path: data/training/ortholog_mappings/rat_human_mouse_tokens.pickle
  dataset_directory: data/training/tokenized_corpus/dataset
  stage6_dir: data/training/prior_knowledge
  homologous_gene_path: vendor/GeneCompass/prior_knowledge/homologous_hm_token.pickle
  # Mixed-species datasets (for Phase 2)
  human_dataset: vendor/GeneCompass/data/randsel_500w_human
  mouse_dataset: vendor/GeneCompass/data/randsel_500w_mouse
  mixed_dataset: data/training/mixed_species_dataset

phase1:
  freeze_encoder: true
  max_learning_rate: 1.0e-04
  train_batch_size_per_gpu: 16
  num_train_epochs: 1
  dataset_directory: data/training/mixed_species_dataset
  use_mixed_species: true
  warmup_steps: 1000
  lr_scheduler_type: linear
  run_name: rat_phase1_freeze_mixed
  # NOTE: species_ratios are documentation only. The actual ratios
  # are baked into the pre-built mixed dataset (40/45/15).
  species_ratios:
    rat: 0.40
    human: 0.45
    mouse: 0.15

phase2:
  freeze_encoder: false
  max_learning_rate: 1.0e-05
  train_batch_size_per_gpu: 14
  num_train_epochs: 1
  warmup_steps: 2000
  lr_scheduler_type: linear
  init_checkpoint: data/models/rat_genecompass_finetuned/models/rat_phase1_freeze_mixed/checkpoint-129449
  # Mixed-species training
  use_mixed_species: true
  dataset_directory: data/training/mixed_species_dataset
  run_name: rat_phase2_mixed_species
  # NOTE: species_ratios are documentation only. The actual ratios
  # are baked into the pre-built mixed dataset (40/45/15).
  species_ratios:
    rat: 0.40
    human: 0.45
    mouse: 0.15

training:
  weight_decay: 0.01
  fp16: true
  gradient_checkpointing: true
  emb_warmup_steps: 10000

initialization:
  t4_word_emb_init: random
  t4_word_emb_std: 0.02
  # The next three keys are read by no code (audit finding 3.7). What they describe is fixed in
  # rat_model_init.py: T3 word rows are always cloned from the ortholog with noise 0.001, and the rat species
  # row is always the mouse row plus noise of species_noise_std. Changing them here changes nothing.
  t3_warm_start: true          # not read
  t3_noise_std: 0.001          # not read
  species_init: mouse_plus_noise   # not read
  species_noise_std: 0.02
  coexp_rescale_factor: 3.9    # applied only to prior rows filled from Stage 6
  t3_prior_source: ortholog    # T3 prior rows = ortholog's pre-trained rows (T3a human, T3b mouse); 2026-10-05
  t4_zero_priors: [promoter, coexp]   # T4 rows left zero: no Stage 6 promoter/co-exp vector is in GC's space (2026-10-05/06)

logging:
  logging_steps: 50
  save_strategy: steps
  save_steps: 10000
  save_total_limit: 5
  wandb_project: motrpac-genecompass-rat

output:
  output_directory: data/models/rat_genecompass_finetuned

distributed:
  nproc_per_node: 4
  nnodes: 1