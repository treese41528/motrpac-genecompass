  Border-associated macrophages:
    compartment: immune
    genes: [Mrc1, Lyve1, Cd163, F13a1]
  Endothelial cells:
    compartment: vascular
    genes: [Cldn5, Flt1, Pecam1, Slc2a1, Ly6c]
  Mural cells:
    compartment: vascular
    genes: [Pdgfrb, Rgs5, Kcnj8, Vtn, Myh11]
  Vascular leptomeningeal cells:
    compartment: stromal
    genes: [Dcn, Col1a2, Slc6a13, Ptgds, Lum]
  Choroid plexus epithelial cells:
    compartment: epithelial
    genes: [Ttr, Kl, Folr1, Clic6]
  Ependymal cells:
    compartment: glial
