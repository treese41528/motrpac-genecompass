    genes: [Slc17a7, Satb2, Neurod6, Tbr1, Camk2a]
  Inhibitory neurons:
    compartment: neural
    genes: [Gad1, Gad2, Slc32a1, Erbb4]
  Astrocytes:
    compartment: glial
