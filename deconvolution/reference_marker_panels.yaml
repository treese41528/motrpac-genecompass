# SPLEEN, OVARY and the coarse HEART panel (REFERENCE_RELABEL_PREREG.md §14, §15). Written 2026-10-31 from
# canonical rodent markers, before any of GSE306764 Spl-Ctrl, GSE343214 or GSE307551 was downloaded.

# SPLEEN (§14; GSE306764 GSM9207348, whole spleen, RBC-lysed). S1 counts: B cells = "B cells"; T cells =
# "T cells" and every T-cell sub-class or T-cell review name; the myeloid class = monocytes + macrophages
# (with their sub-classes) together, or neutrophils, either reaching 100 cells.
SPLEEN:
  Immune cells:
    compartment: immune
    genes: [Ptprc, Coro1a, Lcp1, Laptm5, Cd53]
    sub:
      Macrophages:
        genes: [Cd68, C1qa, C1qb, Adgre1, Csf1r]
        sub:
          Red-pulp macrophages:
            genes: [Spic, Vcam1, Hmox1, Slc40a1, Cd5l]
          Marginal zone macrophages:
            genes: [Marco, Siglec1, Msr1]
      Monocytes:
        genes: [Ccr2, Cd14, Fcnb, Vcan, Plac8]
      Dendritic cells:
        genes: [Flt3, Xcr1, Clec9a, Ccr7, Cd209a]
      Plasmacytoid dendritic cells:
        genes: [Siglech, Spib, Irf8, Bst2, Ccr9]
      Neutrophils:
        genes: [S100a8, S100a9, Csf3r, Cxcr2, Mmp8, Retnlg]
      Eosinophils:
        genes: [Prg2, Epx, Il5ra, Ccr3, Alox15]
      Basophils:
        genes: [Fcer1a, Hdc, Ms4a2, Cpa3, Gata2]
      T cells:
        genes: [Cd3e, Cd3g, Cd3d, Cd2, Lck]
        sub:
          CD4+ T cells:
            genes: [Cd4, Cd40lg, Il7r, Cd28]
          CD8+ T cells:
            genes: [Cd8a, Cd8b, Gzmk, Cd160]
      NK cells:
        genes: [Nkg7, Klrd1, Gzma, Ncr1, Klrb1a]
      B cells:
        genes: [Cd79a, Cd79b, Ms4a1, Cd19, Pax5]
      Plasma cells:
        genes: [Jchain, Mzb1, Xbp1, Sdc1, Prdm1]
  Erythroid cells:
    compartment: other
    genes: [Hba-a1, Hbb, Alas2, Slc4a1, Ahsp, Epb42]
  Megakaryocytes and platelets:
    compartment: other
    genes: [Itga2b, Pf4, Ppbp, Gp9, Gp1bb]
  use: [Endothelial cells, Fibroblasts, Mural cells]

# OVARY (§14; GSE343214 GSM9947804 "Normal rat"). O1 counts: granulosa = "Granulosa cells"; theca/stroma =
# "Theca and stromal cells" with its sub-classes. O2: the non-ovarian share is the share of QC cells whose
# final label is one of the two guard classes below (lung epithelium, hepatocytes); cells so labelled never
# enter the reference even when O2 passes. The per-cell share with any Sftpc/Scgb1a1/Alb/Apoa1 count is
# reported beside it, not used to decide.
OVARY:
  Granulosa cells:
    compartment: parenchymal
    genes: [Cyp19a1, Amh, Inha, Fshr, Hsd17b1]
  Luteal cells:
    compartment: parenchymal
    genes: [Cyp11a1, Scarb1, Ptgfr, Prlr, Hsd3b1]
  Theca and stromal cells:
    compartment: stromal
    genes: [Tcf21, Nr2f2, Dcn, Pdgfra, Col1a1]
    sub:
      Theca cells:
        genes: [Cyp17a1, Lhcgr, Star, Mgarp]
      Stromal cells:
        genes: [Dcn, Lum, Ogn, Col1a2]
  Oocytes:
    compartment: other
    genes: [Zp3, Gdf9, Bmp15, Figla, Ooep]
  Ovarian surface epithelial cells:
    compartment: epithelial
    genes: [Upk3b, Lrrn4, Msln, Krt19, Krt8]
  Oviduct epithelial cells:
    compartment: epithelial
    genes: [Pax8, Foxj1, Krt7, Krt8, Dynlrb2]
  Lung epithelial cells (non-ovarian):     # O2 guard
    compartment: epithelial
    genes: [Sftpc, Sftpb, Scgb1a1, Napsa]
  Hepatocytes (non-ovarian):               # O2 guard
    compartment: parenchymal
    genes: [Alb, Apoa1, Apoh, Fgb]
  use: [Endothelial cells, Lymphatic endothelial cells, Mural cells, Erythroid cells, Immune cells]

# HEART_COARSE (§15; GSE307551 F344 libraries GSM9226643/4, snRNA of uninjured ventricles). Coarse classes
# only; the two immune classes sit under one parent so they are told apart among siblings.
HEART_COARSE:
  Cardiomyocytes:
    compartment: parenchymal
    genes: [Tnnt2, Myh6, Actc1, Ryr2, Myl2]
  Fibroblasts:
    compartment: stromal
    genes: [Col1a1, Col1a2, Dcn, Pdgfra, Tcf21]
  Endothelial cells:
    compartment: vascular
    genes: [Pecam1, Cdh5, Emcn, Flt1, Kdr]
  Mural cells:
    compartment: stromal
    genes: [Rgs5, Notch3, Kcnj8, Abcc9, Myh11]
  Immune cells:
    compartment: immune
    genes: [Ptprc, Coro1a, Lcp1, Laptm5, Cd53]
    sub:
      Myeloid cells:
        genes: [Cd68, C1qa, C1qb, Csf1r, Cd14]
      Lymphocytes:
        genes: [Cd3e, Cd2, Cd79a, Ms4a1, Nkg7, Il2rg]
  Adipocytes:
    compartment: other
    genes: [Adipoq, Plin1, Cidec, Lipe, Lep]
  Neural and Schwann cells:
    compartment: glial
    genes: [Plp1, Mpz, S100b, Sox10, Nrxn1]
  Epicardial and mesothelial cells:
    compartment: stromal
    genes: [Msln, Upk3b, Wt1, Lrrn4, Krt19]

# §15: the production HEART reference's 16 types (references_v3/HEART_GSE280111_LV/cells_meta.tsv) summed into
# the coarse classes. Not a panel (joint_reannotate.py reads only the key it is given). A GSE307551 cluster
# left at "Immune cells" is resolved to Myeloid cells or Lymphocytes in review.
HEART_PRODUCTION_TO_COARSE:
  Cardiomyocytes: Cardiomyocytes
  Cardiac fibroblasts: Fibroblasts
  Endothelial cells: Endothelial cells
  Lymphatic endothelial cells: Endothelial cells
  Pericytes: Mural cells
  Vascular smooth muscle cells: Mural cells
  Macrophages: Myeloid cells
  Monocytes: Myeloid cells
  Dendritic cells: Myeloid cells
  Mast cells: Myeloid cells
  T cells: Lymphocytes
  CD8+ T cells: Lymphocytes
  B cells: Lymphocytes
  NK cells: Lymphocytes
  Cardiac neurons: Neural and Schwann cells
  Mesothelial cells: Epicardial and mesothelial cells
