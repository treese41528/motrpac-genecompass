# Marker panels for the joint re-annotation of the deconvolution references
# (REFERENCE_RELABEL_PREREG.md §10). Written 2026-10-27 from canonical rodent markers, before any joint
# clustering was run. Symbols are rat gene names, resolved to the reference's gene IDs through Ensembl 115
# (rat_gene_info.tsv), the corpus gene universe, then RGD (GENES_RAT.txt); rat names differ from mouse for a
# few (Myl11 = Mylpf, Drc12 = Ccdc153, Car7 = Ca7, Tp63 = Trp63, Ly6c = Ly6c1). Rat has no Lyz1.
#
# Structure: each reference lists top-level classes. A class has
#   compartment  epithelial | parenchymal | neural | glial | vascular | stromal | immune | other
#                (two top-level classes from different compartments both scoring high flags a doublet)
#   genes        3-6 markers
#   sub          optional child classes, scored among siblings only inside clusters assigned the parent
# Shared panels (the `_shared` block) are pulled in by name with `use: [...]`.
#
# The rule that turns panel scores into labels is in REFERENCE_RELABEL_PREREG.md §10 and
# deconvolution/joint_reannotate.py; nothing here is tuned to the data.

_shared:
  Endothelial cells:
    compartment: vascular
    genes: [Pecam1, Cdh5, Emcn, Flt1, Kdr, Ptprb]
  Lymphatic endothelial cells:
    compartment: vascular
    genes: [Prox1, Mmrn1, Ccl21, Lyve1, Flt4]
  Fibroblasts:
    compartment: stromal
    genes: [Col1a1, Col1a2, Dcn, Lum, Pdgfra]
  Mural cells:                          # pericytes + vascular smooth muscle
    compartment: stromal
    genes: [Pdgfrb, Rgs5, Notch3, Acta2, Myh11]
    sub:
      Pericytes:
        genes: [Rgs5, Kcnj8, Abcc9, Higd1b]
      Vascular smooth muscle cells:
        genes: [Myh11, Acta2, Cnn1, Tagln]
  Mesothelial cells:
    compartment: stromal
    genes: [Msln, Upk3b, Lrrn4, Wt1]
  Schwann cells:
    compartment: glial
    genes: [Mpz, Pmp22, S100b, Plp1, Sox10]
  Erythroid cells:
    compartment: other
    genes: [Hba-a1, Hbb, Alas2, Slc4a1]
  Immune cells:
    compartment: immune
    genes: [Ptprc, Coro1a, Lcp1, Laptm5, Cd53]
    sub:
      Macrophages:
        genes: [Cd68, C1qa, C1qb, Adgre1, Mrc1]
      Monocytes:
        genes: [Ccr2, Cd14, Sell, Fcnb, S100a4]
      Dendritic cells:
        genes: [Flt3, Xcr1, Clec9a, Ccr7, Cd209a]
      Neutrophils:
        genes: [S100a8, S100a9, Csf3r, Cxcr2, Mmp8]
      Mast cells:
        genes: [Cpa3, Cma1, Tpsb2, Kit, Fcer1a]
      T cells:
        genes: [Cd3e, Cd3g, Cd3d, Cd2, Lck]
        sub:
          CD4+ T cells:
            genes: [Cd4, Cd40lg, Il7r, Cd28]
          CD8+ T cells:
            genes: [Cd8a, Cd8b, Gzmk, Cd160]
      NK cells:
        genes: [Nkg7, Klrd1, Gzma, Ncr1, Klrb1a]
      B cells:
        genes: [Cd79a, Cd79b, Ms4a1, Cd19, Pax5]
      Plasma cells:
        genes: [Jchain, Mzb1, Xbp1, Sdc1, Prdm1]

KIDNEY:
