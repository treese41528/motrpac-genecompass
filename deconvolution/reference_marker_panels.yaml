HIPPOC:
  <<: *brain
  Excitatory neurons:
    compartment: neural
    genes: [Slc17a7, Neurod6, Camk2a, Satb2, Tbr1]
    sub:
      Dentate gyrus granule cells:
        genes: [Prox1, C1ql2, Dsp, Stxbp6]
      Pyramidal neurons:
        genes: [Fibcd1, Spink8, Mpped1, Wfs1]

