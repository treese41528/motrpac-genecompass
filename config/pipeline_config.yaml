# ============================================================
# GeneCompass Rat Fine-Tuning Pipeline Configuration
# ============================================================
# POLICY ONLY — all tunable parameters and paths.
# Mechanism lives in lib/gene_utils.py which reads this file.
#
# Path resolution:
#   All paths are relative to project_root.
#   project_root defaults to "." — override via PIPELINE_ROOT env var.
#
# Usage:
#   import yaml, os
#   with open("config/pipeline_config.yaml") as f:
#       config = yaml.safe_load(f)
#   root = os.environ.get("PIPELINE_ROOT", config["project_root"])

# ============================================================
# Project root (override with PIPELINE_ROOT env var)
# ============================================================
project_root: "."

# ============================================================
# BioMart Reference
# ============================================================
# The canonical rat gene universe is defined as Ensembl BioMart
# (release + assembly below). All pipeline outputs are indexed by
# canonical ENSRNOG IDs from this release. Noncanonical identifiers
# are resolved via deterministic mapping rules; unresolved identifiers
# are excluded with audit logs.
biomart:
  # The files on disk (data/references/biomart/) are Ensembl 115 / GRCr8 exports, fetched 2026-02-24
  # from the live www.ensembl.org BioMart (then release 115) and byte-identical to the archive below.
  # The label here used to say 113 / mRatBN7.2, which was wrong. Re-fetch from the ARCHIVE host only
  # (the live host moves to each new release); see harvesting.biomart_server.
  ensembl_release: "115"        # REQUIRED — verified before stage runs
  assembly: "GRCr8"             # REQUIRED
  species: "rattus_norvegicus"
  archive_host: "https://sep2025.archive.ensembl.org"   # Ensembl 115 archive (September 2025)
  download_date: "2026-02-24"   # REQUIRED — date the on-disk files were fetched

  # Primary gene annotation (Gene stable ID, Gene name, Gene type, Chr, Desc)
  rat_gene_info: data/references/biomart/rat_gene_info.tsv
  # Expected checksum — Stage 2/3 refuse a different file (BioMartReference.from_config)
  rat_gene_info_md5: "aa206a030b06c5cfe376c1cd211e5a53"

  # md5 + size of every file in data/references/biomart/ as the v2 build read them. Stage 2 step 1
  # (build_gene_universe.py, incl. its RGD synonym loader) checks the files it reads against this
  # table and fails on a mismatch, unless run with --allow-reference-drift or this flag is true.
  reference_md5sums: config/reference_md5sums.tsv
  allow_reference_drift: false

  # Supplementary (adds NCBI gene IDs)
  rat_genes_biomart: data/references/biomart/rat_all_genes.tsv

  # Ortholog tables
  rat_human_orthologs: data/references/biomart/rat_human_orthologs.tsv
  rat_mouse_orthologs: data/references/biomart/rat_mouse_orthologs.tsv
  mouse_human_orthologs: data/references/biomart/mouse_human_orthologs.tsv 
# ============================================================
# RGD Reference
# ============================================================
rgd:
  genes_file: data/references/biomart/GENES_RAT.txt
  use_for_biotype_fallback: false
  use_for_symbol_synonyms: true
  require_biomart_resolution: true

# ============================================================
# Data Directories (all relative to project_root)
# ============================================================
paths:
  qc_h5ad_dir: data/training/qc_h5ad
  # 868 = the h5ads in qc_h5ad_dir, one per row of config/corpus_v2_plan.tsv (584 kept by v2, incl. the two
  # OMIX767 testis files from qc_external_mtx.py). A rerun of Stage 2 from raw GEO writes a different set
  # (docs/repro_stages1_7/REPRODUCTION.md). Only a >10% deviation warns.
  expected_qc_h5ad_files: 868

  gene_universe_dir: data/training/gene_universe
  ortholog_dir: data/training/ortholog_mappings
  # The working model is retrain v2 (docs/RETRAIN_V2_RESULTS.md): the corpus stages read only the files
  # config/corpus_v2_plan.tsv keeps, and the medians and tokenized corpus are v2's. April's model and its
  # inputs: export PIPELINE_PROFILE=config/profiles/april.yaml
  qc_file_list: config/corpus_v2_plan.tsv
  median_dir: data/training/gene_medians_v2
  hybrid_medians: data/training/gene_medians_v2/hybrid_gene_medians.pickle
  reference_dir: data/training/reference_files
  tokenized_corpus_dir: data/training/tokenized_corpus_v2

  motrpac_data_dir: data/motrpac/rat_training_6mo
  motrpac_processed_dir: data/motrpac/processed

  genecompass_dir: vendor/GeneCompass
  genecompass_scdata: vendor/GeneCompass/scdata
  genecompass_medians: vendor/GeneCompass/scdata/dict/human_gene_median_after_filter.pickle
  genecompass_tokens: vendor/GeneCompass/prior_knowledge/human_mouse_tokens.pickle
  genecompass_homologs: vendor/GeneCompass/prior_knowledge/homologous_hm_token.pickle

  prior_knowledge_dir: data/training/prior_knowledge
  hgnc_file: data/references/hgnc/hgnc_complete_set.txt
  # Stage 6 promoter step (build_promoter_embedding.py downloads it if absent): the Ensembl 115 / GRCr8
  # genome, matching the BioMart release above. (Older runs used the release-113 mRatBN7.2 FASTA under
  # data/references/genome/Rattus_norvegicus.mRatBN7.2.dna.toplevel.fa.gz; no Stage 6 promoter vector
  # enters v2's init.)
  rat_genome_fasta: data/references/genome/Rattus_norvegicus.GRCr8.dna.toplevel.fa.gz
  mouse_human_orthologs: data/references/biomart/mouse_human_orthologs.tsv

  models_dir: data/models
  results_dir: data/results

# ============================================================
# Stage 1: Data Harvesting & QC
# ============================================================
harvesting:
  email: "reese18@purdue.edu"
  # Pinned to the Ensembl 115 archive (biomart.archive_host); the live www.ensembl.org host serves
  # whatever release is current, so a fetch from it would not reproduce the v2 reference files.
  biomart_server: "https://sep2025.archive.ensembl.org/biomart/martservice"
  # RGD serves only the current GENES_RAT.txt (no dated archive). v2 used the file whose header reads
  # '# GENERATED-ON: 2026/02/21' (md5 in config/reference_md5sums.tsv); it is deposited with the v2 data.
  rgd_genes_url: "https://download.rgd.mcw.edu/data_release/GENES_RAT.txt"
  biomart_timeout: 600
  fetch_species:
    - rat
    - mouse
    - human
  test_genes:
    - actb
    - gapdh
    - ube2m
    - dhfr
    - gnai3
    - pin1
    - ccl5
    - apoe
    - tp53
    - brca1
    - egfr
    - vegfa
    - il6
    - tnf

  geo_output_dir: data/raw/geo
  geo_metadata_file: geo_metadata.csv
  geo_query: "rattus norvegicus[organism] AND single cell RNA-seq"
  geo_batch_esummary: 400

  arrayexpress_output_dir: data/raw/arrayexpress
  arrayexpress_metadata_file: arrayexpress_metadata.csv

  matrix_staging_dir: data/matrix_staging
  min_cells_per_study: 4
  min_genes_per_cell: 200
  max_mito_fraction: 0.15

  llm_model: "claude-haiku-4-5"
  llm_cost_limit_usd: 5.0
  llm_output_file: data/catalog/llm_study_analysis.json
  llm_debug_dir: data/catalog/debug_responses
  llm_save_responses: false
  llm_rate_limit: 40
  llm_max_tokens: 8192
  llm_filter_organism: "rattus"
  llm_filter_usable: true
  data_root: data/raw
  catalog_file: data/gene_inventory/study_catalog.tsv
  catalog_dir: data/catalog

  sources:
    geo:
      single_cell:
        enabled: true
        path: geo/single_cell/geo_datasets
      bulk:
        enabled: true
        path: geo/bulk/geo_datasets
    arrayexpress:
      single_cell:
        enabled: true
        path: arrayexpress/singlecell/datasets
      bulk:
        enabled: true
        path: arrayexpress/bulk/datasets

  extraction:
    max_files_per_study: 500

# ============================================================
# Stage 2: Gene Universe
# ============================================================
gene_universe:
  # ── Step 1 gene universe construction ──
  biomart_gate: true
  min_biomart_match: 0.30
  match_sample_size: 1000
  match_sample_seed: 0
  min_studies: 2
  keep_biotypes:
    - protein_coding
    - lncrna
    - mirna
  accession_patterns:
    - "^GSE\\d+$"
    - "^E-[A-Z]+-\\d+$"
    - "^E-[A-Z]+-[A-Z]+-\\d+$"
  fail_on_unrecognized_accession: true

  # ── Step 2 cell QC thresholds (GeneCompass-exact) ──
  preprocessing:
    min_genes_per_cell: 200
    min_cells_per_sample: 4
    max_mito_fraction: 0.15
    outlier_sd_threshold: 3.0
    min_core_genes_per_cell: 7
    save_qc_matrices: true

  # ── Step 3 expression-based pruning ──
  # GeneCompass architecture: biotype filtering (Step 1) + top-2048
  # ranking (Stage 5) are the real gene selectors. This step only
  # removes genes with zero expression in the entire QC'd corpus —
  # carrying extra genes through Stages 3-4 is cheap.
  pruning:
    min_cells_nonzero: 1           # Expressed in ≥1 QC'd cell

# ============================================================
# Stage 3: Ortholog Mapping — UPDATED CONFIG
# ============================================================
# Replace the existing 'orthologs:' section in pipeline_config.yaml
# with this block.
#
# KEY CHANGE: No identity thresholds.
# GeneCompass empirically used none (min observed: 1.2%).
# Ensembl's tree-based orthology inference IS the quality gate.
# ============================================================

orthologs:
  # Tier priority:
  #   T1  tri-species one2one → T2a human one2one → T2b mouse one2one →
  #   T3a human one2many/many2many → T3b mouse one2many/many2many →
  #   T4  new rat token
  #
  # GeneCompass empirically used: 89.6% one2one, 7.9% one2many, 2.4% many2many
  # with NO identity threshold (min observed: 1.2%)

  # Orthology types accepted per tier level
  one2one_types:
    - ortholog_one2one

  multi_types:
    - ortholog_one2many
    - ortholog_many2many

  # No identity threshold — Ensembl tree-based inference is the quality gate.
  # This key is retained for documentation only; the script ignores it.
  identity_threshold: null

  # For one2many / many2many disambiguation: pick ortholog with highest % identity
  disambiguation: highest_identity

  # Biotypes eligible for new token assignment (Tier 4)
  new_token_biotypes:
    - protein_coding
    - lncRNA
    - miRNA

# ============================================================
# Stage 4: Gene Medians
# ============================================================
medians:
  method: sparse_vectorized
  min_nonzero_cells: 10
  # Scatter task count (compute_gene_medians.py --n-tasks default; run_stage4.py runs tasks 0..N-1).
  # v2 was built with 16 (stage4_manifest.json n_scatter_tasks). Files are assigned to tasks by stride,
  # so N changes the scatter files; keep 16 to reproduce v2's Stage 4 outputs byte for byte.
  n_scatter_tasks: 16

# ============================================================
# Stage 5: Reference Assembly & Corpus Export
# ============================================================
reference_assembly:
  cells_per_shard: 50000
  biotype_output_map:
    protein_coding: protein_coding
    lncrna: lncRNA                 # GeneCompass paper includes lncRNA in core gene list
    mirna: miRNA

  # Per-cell gene ranking for GeneCompass tokenization.
  # GeneCompass paper: "a sequence of 2048 genes for each cell sample,
  # with each sequence obtained according to the corresponding ranked
  # high expression."
  # Consumed by Stage 5 (corpus export), NOT by Step 1 (cell QC).
  top_n_genes: 2048

  # Tokenize task count (tokenize_corpus.py --n-tasks and assemble_corpus.py --expected-tasks default;
  # run_stage5.py runs tasks 0..N-1). v2 was built with 50 (stage5_manifest.json). Files are assigned to
  # tasks by stride and the corpus is assembled task by task, so N DETERMINES THE ROW ORDER of the
  # tokenized corpus (and hence of the training mix): change it and the dataset is no longer v2's.
  n_tokenize_tasks: 50

  # MoTrPAC exclusion list (data leakage prevention)
  exclude_studies:
    - "GSE242354"   # MoTrPAC Endurance Exercise Training Study


# ============================================================
# Stage 6: Prior Knowledge Embeddings
# ============================================================
prior_knowledge:

  # Step 1: Co-expression embedding
  coexp:
    pcc_threshold: 0.8          # GeneCompass exact
    n_sample_cells: 3000        # GeneCompass exact
    min_shared_cells: 10        # Methodological addition (guard sparse data)
    min_expr_ratio: 0.05        # Methodological addition (pre-filter)
    chunk_size: 2000            # Memory management
    vector_size: 768
    window: 1
    sg: 1                       # Skip-gram
    epochs: 30
    workers: 8

  # Step 2: Gene family embedding
  # Deterministic since 2026-11-01: workers 1 + seed + PYTHONHASHSEED (the script re-execs itself under
  # hash_seed). The on-disk family_embeddings.pkl was trained with workers: 8 and cannot be regenerated; a
  # rerun gives different vectors (mean per-gene correlation 0.77). v2 takes no family rows (0 of 2,474 T4
  # genes have a non-zero family vector), so this does not touch v2.
  gene_family:
    min_family_size: 2          # GeneCompass exact
    vector_size: 768
    window: 1
    sg: 1
    epochs: 30
    workers: 1                  # was 8 (not deterministic)
    seed: 42
    hash_seed: 0                # PYTHONHASHSEED for the word2vec run
    # HGNC download if paths.hgnc_file is missing: a dated monthly archive snapshot. The local file v2's
    # Stage 6 read (md5 5e1e18fea6f3b34dca80758c5322a9e6, fetched 2026-03-17) is not in the archive
    # (between the 03-06 and 04-01 snapshots); it is deposited.
    hgnc_url: "https://storage.googleapis.com/public-download-files/hgnc/archive/archive/monthly/tsv/hgnc_complete_set_2026-03-06.txt"
    rat_only_tokens: true       # Only embed rat-specific tokens (T4); 
                                # ortholog-mapped tokens inherit from GC

  # Steps 3 & 4: Promoter and GRN — stubs, not yet implemented
  promoter:
    enabled: true             # Requires DNABert + Ensembl genome sequences
    dnabert_model: "zhihan1996/DNA_bert_6"
    # HF Hub commit of the DNABERT-6 snapshot used (from the local HF cache, refs/main)
    dnabert_revision: "c56e67ea5827e0ddc67ef059addcf71569b1216e"
  grn:
    enabled: true   # PECA2vec cross-species transfer from GeneCompass human/mouse GRNs

# ============================================================
# Stage 8: Deconvolution (BayesPrism)
# ============================================================
# All paths relative to project_root. Cluster data is expected to be symlinked
# into data/ (e.g. data/training/preprocessed -> /depot/.../training/preprocessed).
# Machine-specific overrides belong in the gitignored config/pipeline_config.local.yaml.
deconvolution:
  # Fine-tuned weights Stages 9, 12 and 13 load (explicit, so a new checkpoint cannot change results;
  # md5 of pytorch_model.bin ae6100ff..., identical to checkpoint-591763)
  model_checkpoint: data/models/rat_genecompass_finetuned_v2/models/rat_phase2_mixed_species/models
  de_seed: 1            # IHW fold seed (1 = IHW's own default, what every run so far used)
  # Inputs: single-cell corpus (raw QC matrices) + per-sample annotations
  qc_matrices_dir: data/training/preprocessed/qc_matrices
  cell_annotations_dir: data/training/cell_annotations
  consensus_annotations_dir: data/training/cell_annotations_consensus
  annotation_inventory: reports/annotations/annotation_inventory.tsv
  # Rat gene-cleanup list (ribo/mito/hb; replaces BayesPrism's hs/mm-only cleanup)
  rat_exclude_genes: deconvolution/reference/rat_exclude_genes.tsv
  # Rat protein-coding gene list (Gene type == protein_coding from biomart
  # rat_gene_info.tsv -- the same biotype source GeneCompass Stage 2 uses).
  # Replaces BayesPrism's hs/mm-only select.gene.type="protein_coding". Derived
  # via deconvolution/build_protein_coding_list.py.
  rat_protein_coding_genes: deconvolution/reference/rat_protein_coding_genes.tsv
  protein_coding_only: true   # subset reference to protein-coding before new.prism
  # Rat sex-chromosome gene list (chrX/chrY from biomart rat_gene_info.tsv),
  # replacing BayesPrism's hs/mm-only cleanup.genes chrX/chrY groups. Removing them
  # stops sex composition from confounding cell-type fractions in mixed-sex bulk.
  # Derived via deconvolution/build_sex_chrom_list.py.
  rat_sex_chrom_genes: deconvolution/reference/rat_sex_chrom_genes.tsv
  exclude_sex_chromosomes: true
  # Committed reference artifacts (small, tracked; live with the code under deconvolution/reference/)
  rat_genecompass_genes: deconvolution/reference/rat_genecompass_genes.tsv  # GeneCompass token-gene keep-list
  sample_pheno: deconvolution/reference/motrpac_sample_pheno.tsv            # PHENO viallabel -> sex/group/weeks
  pa_genes: deconvolution/reference/motrpac_pa_genes.tsv                    # training-regulated (PA) genes, rel-113
  reference_dir: deconvolution/reference   # root for the committed reference TSVs above
  # Outputs -- regenerable + gitignored, under data/deconvolution/ (NOT in the code tree)
  output_root: data/deconvolution
  built_reference_dir: data/deconvolution/references     # build_reference.py per-tissue SC references
  idspace_audit_dir: data/deconvolution/idspace_audit    # audit_idspace.py output
  validation_dir: data/deconvolution/validation
  # Default = all 16 tissues with a reference (since 2026-11-01, REFERENCE_RELABEL_PREREG.md §14/§16,
  # ALL_TISSUE_RERUN_RESULTS.md): the jointly re-annotated references (references_v4/, tissue_references.yaml;
  # REFS4_RERUN_RESULTS.md) plus SPLEEN and OVARY, with the v2 model. The 14 refs4 tissues are linked into the
  # _refs4all folders from the _refs4 ones. The 14-tissue result is config/profiles/refs4_14.yaml; the
  # July-reference v2 outputs are config/profiles/july_refs.yaml; April's model is config/profiles/april.yaml.
  results_dir: data/deconvolution/results_refs4all
  genecompass_input_dir: data/deconvolution/genecompass_input_v2_refs4all  # pseudo-cells/tokenized/embeddings/umap
  # Fine-tuned rat GeneCompass for Stage 9 embedding (pipeline/run_stage9.py picks the
  # latest checkpoint-* beneath this dir). Under data/models/ (gitignored data tree).
  genecompass_model_dir: data/models/rat_genecompass_finetuned_v2/models/rat_phase2_mixed_species
  # Stage 9/12 tokenizer normalize_total target, calibrated so the pseudo-cells' token-value median matches
  # the model's corpus (v2 6,400; April 6,500). Stage 12 must use the rat run's value.
  pseudocell_target_sum: 6400
  # The Aim-2 gate table whose q_sup_trained < 0.05 blocks are the exercise hotspots (Stage 10 and the
  # DE wrapper): the 10 splits x 10,000 permutations gate (pre-registration §6), scored under the §6
  # analysable-block rule (median library >= 1,000; REFERENCE_RELABEL_PREREG.md §6).
  hotspots_table: data/deconvolution/genecompass_input_v2_refs4all/gate_rcv10/corroboration_merged.tsv
  # Canonical-Augur exports (augur_prep.py) and the Stage 13 differential GRNs in rat and human space.
  augur_input_dir: data/deconvolution/augur_input_v2_refs4all
  grn_dir: data/deconvolution/grn_v2_refs4all
  grn_human_dir: data/deconvolution/grn_v2_refs4all_human
  # Positive-control spec with the targets renamed to the joint labels (genes/directions unchanged;
  # posctrl_celltype_map_refs4.tsv, REFERENCE_RELABEL_PREREG.md §11). July's: reference/posctrl_prereg.tsv.
  posctrl_prereg: deconvolution/reference/posctrl_prereg_refs4.tsv
  reference_v2_dir: data/deconvolution/references_v2     # V2 re-audited SC references
  validation_v2_dir: data/deconvolution/validation_v2    # V2 validation pseudobulk/results
  # Runtime (R / BayesPrism)
  n_cores: 4
  r_module: r/4.4.1
  # Real MoTrPAC bulk gene-ID liftover (Fix 1): lift consortium TRNSCRPT_<TISSUE>_RAW_COUNTS
  # (older Ensembl rat build) -> current mRatBN7.2 ENSRNOG via three bridges: direct match,
  # a FEATURE_TO_GENE symbol bridge, and an Entrez/RGD ID-history bridge (rgd.genes_file
  # above + FEATURE_TO_GENE.entrez_gene; recovers genes whose ENSRNOG/symbol changed across
  # the Rnor_6.0->mRatBN7.2 rebuild). Then write deconv-ready samples x genes bulk per
  # tissue. Built by deconvolution/R/prepare_motrpac_bulk.{R,sh}; biomart rat_gene_info
  # (above) supplies the current-ID universe.
  motrpac_bulk_dir: data/motrpac/rat_training_6mo/data        # source TRNSCRPT_*_RAW_COUNTS.rda
  rat_token_mapping: data/training/ortholog_mappings/rat_token_mapping.tsv  # GeneCompass token vocab
  motrpac_bulk_liftover: deconvolution/reference/motrpac_bulk_liftover.tsv  # auditable per-gene map (committed)
  motrpac_bulk_liftover_report: deconvolution/reference/motrpac_bulk_liftover_report.txt  # coverage report (committed)
  motrpac_bulk_out: data/deconvolution/motrpac_bulk          # per-tissue lifted bulk (gitignored output)