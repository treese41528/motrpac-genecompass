  augur_input_dir: data/deconvolution/augur_input_v2_refs4h2
  grn_dir: data/deconvolution/grn_v2_refs4h2
  grn_human_dir: data/deconvolution/grn_v2_refs4h2_human
  posctrl_prereg: deconvolution/reference/posctrl_prereg_refs4.tsv
