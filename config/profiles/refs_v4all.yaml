# All-tissue arm (2026-11-01, REFERENCE_RELABEL_PREREG.md §14 "What follows", §16): refs4 plus the two new
# references, SPLEEN (GSE306764) and OVARY (GSE343214) -- 16 tissues.
#   export PIPELINE_PROFILE=config/profiles/refs_v4all.yaml
# The 14 refs4 tissues are linked in from the refs4 folders (slurm/analysis/refs4all_setup.sh); SPLEEN and
# OVARY live here. The cross-tissue steps (gate BH, pooled IHW/repfdr, transfer comparison, GRNs, Stage 14)
# are rerun over all 16. The 14-tissue refs4 result stays the registered comparison.
# Since 2026-11-01 these are also the default config values, so this profile is a no-op kept for scripts.
deconvolution:
  results_dir: data/deconvolution/results_refs4all
  genecompass_input_dir: data/deconvolution/genecompass_input_v2_refs4all
  hotspots_table: data/deconvolution/genecompass_input_v2_refs4all/gate_rcv10/corroboration_merged.tsv
  augur_input_dir: data/deconvolution/augur_input_v2_refs4all
  grn_dir: data/deconvolution/grn_v2_refs4all
  grn_human_dir: data/deconvolution/grn_v2_refs4all_human
  posctrl_prereg: deconvolution/reference/posctrl_prereg_refs4.tsv
