[pytest]
testpaths = tests
# network: queries NCBI / EBI live.  data: reads this machine's pipeline files under data/.
# Both are skipped by default; run them with  pytest -m network  or  pytest -m data.
markers =
    network: needs internet access (NCBI, EBI, ENA)
    data: needs the pipeline's data files on disk
addopts = -m "not network and not data"
